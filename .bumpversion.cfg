[bumpversion]
current_version = 0.0.3
commit = True
tag = True
tag_name = {new_version}

[bumpversion:file:spices/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:spices/core/pkgindex.py]
search = "User-Agent": "spices/{current_version}"
replace = "User-Agent": "spices/{new_version}"

[bumpversion:file:README.rst]
search = Current version: {current_version}
replace = Current version: {new_version}

[bumpversion:file:README.short.rst]
search = Current version: {current_version}
replace = Current version: {new_version}
