name: Pull Request

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
    branches:
      - develop

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Filter
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
      sphinx: ${{ steps.filter.outputs.sphinx }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          is_docs_path() {
            local f="$1"
            [[ "$f" == README.md || "$f" == README.rst ]] && return 0
            [[ "$f" =~ ^LICENSE ]] && return 0
            [[ "$f" =~ ^(HISTORY|CHANGELOG) ]] && return 0
            [[ "$f" == docs || "$f" =~ ^docs/ ]] && return 0
            [[ "$f" =~ ^\.github/ISSUE_TEMPLATE(/|$) ]] && return 0
            [[ "$f" == ".github/PULL_REQUEST_TEMPLATE.md" ]] && return 0
            return 1
          }
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${HEAD_SHA}"
          fi
          files="$(git diff --name-status "${BASE_SHA}...${HEAD_SHA}" || true)"
          run=false
          sphinx=false
          if [ -z "${files}" ]; then
            run=true
          else
            while IFS=$'\t' read -r status p1 p2; do
              [ -z "${status}" ] && continue
              for f in "${p1}" "${p2}"; do
                [ -z "${f}" ] && continue
                [[ "$f" == docs || "$f" =~ ^docs/ ]] && sphinx=true
                if is_docs_path "${f}"; then
                  continue
                fi
                run=true
                break 2
              done
            done <<< "${files}"
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "sphinx=${sphinx}" >> "${GITHUB_OUTPUT}"
  lint:
    name: Linting
    needs: [filter]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installing dependencies
        run: |
          sudo apt-get install -y libatomic1
          python3 -m pip install -r requirements-dev.txt

      - name: Running linter
        run: |
          tox -e lint

  lint-skip:
    name: Linting
    needs: [filter]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Skip docs-only changes
        run: echo "Docs-only PR; skipping expensive checks."

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [filter, lint]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run == 'true'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install package
        run: |
          sudo apt-get install -y libatomic1 libxml2-dev libxslt-dev
          python3 -m pip install -r requirements-dev.txt
          python3 -m pip install -e .

      - name: Run integration test
        run: |
          docker run \
              -v ${PWD}:${PWD} \
              -w ${PWD} \
              dockershelf/python:3.11-stable \
              bash -c "pip install . && \
                       cd ${PWD}/tests/cases/debian && \
                       spices install"

      - name: Test CLI entry point
        run: |
          spices --version
          spices --help

      - name: Measuring coverage
        env:
          PYTHON_VERSION: "3.13"
        run: |
          tox -e coverage

      - name: Coveralls
        id: coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./.lcov

      - name: Wait before Coveralls retry
        if: steps.coveralls.outcome == 'failure'
        run: sleep 30

      - name: Coveralls (retry)
        if: steps.coveralls.outcome == 'failure'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./.lcov
          fail-on-error: false

  tests-skip:
    name: Tests
    needs: [filter]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Skip docs-only changes
        run: echo "Docs-only PR; skipping expensive checks."

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [filter]
    if: github.event.pull_request.draft == false && (needs.filter.outputs.run == 'true' || needs.filter.outputs.sphinx == 'true')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools
          python3 -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          cd docs
          python3 -m sphinx -T -b html -d _build/doctrees -D language=en . _build/html

  docs-skip:
    name: Documentation
    needs: [filter]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run != 'true' && needs.filter.outputs.sphinx != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Skip docs-only changes
        run: echo "Docs-only PR with no Sphinx path changes; skipping."

  # >>> rosey-maintainer:ci-quality BEGIN
  code-quality:
    name: Code Quality
    needs: [filter]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Semgrep scan
        run: |
          BASELINE="${{ github.event.pull_request.base.sha }}"
          semgrep scan \
            --config p/ci \
            --config p/python \
            --baseline-commit "${BASELINE}" \
            --metrics=off \
            --error
  # <<< rosey-maintainer:ci-quality END

  code-quality-skip:
    name: Code Quality
    needs: [filter]
    if: github.event.pull_request.draft == false && needs.filter.outputs.run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Skip docs-only changes
        run: echo "Docs-only PR; skipping expensive checks."
