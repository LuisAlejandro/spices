name: Push

on:
  push:
    branches:
      - master
      - develop
      - "release/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        distro:
          - alpine
          - arch
          - centos
          - debian
          - fedora
          - gentoo
        npm: [true, false]
        yarn: [true, false]
        bundler: [true, false]
        pip: [true, false]
        include:
          - python-version: "3.8"
            toxenv: "py38"
          - python-version: "3.9"
            toxenv: "py39"
          - python-version: "3.10"
            toxenv: "py310"
          - python-version: "3.11"
            toxenv: "py311"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installing dependencies
        run: |
          sudo apt-get install libxml2-dev libxslt-dev
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Measuring coverage
        env:
          TOXENV: ${{ matrix.toxenv }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tox -e ${TOXENV}
      - name: Functional test
        env:
          TOXENV: ${{ matrix.toxenv }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          case "${TOXENV}" in
            py38|py39|py310) DOCKER_TAG="3.10" ;;
            py311) DOCKER_TAG="3.11-stable" ;;
            *) DOCKER_TAG="${PYTHON_VERSION}" ;;
          esac
          docker run \
              -v ${PWD}:${PWD} \
              -w ${PWD} \
              dockershelf/python:${DOCKER_TAG} \
              bash -c "pip install . && \
                       cd ${PWD}/tests/cases/debian && \
                       spices install"
  release-gate:
    name: Release Gate
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Confirm all release checks passed
        run: |
          echo "Release gate passed for ${{ github.ref_name }}"

